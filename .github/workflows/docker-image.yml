name: Build and Push Custom AFFiNE Image

on:
  push:
    branches: [ "canary" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - name: Install dependencies
        run: |
          yarn install --inline-builds
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Web Frontend
        run: |
          yarn affine @affine/web build

      - name: Build Backend Server
        run: |
          yarn workspace @affine/server build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.selfhost
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:custom
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}:latest
